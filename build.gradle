plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = "${mod_version}-${minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()

    maven {
        url "https://cursemaven.com"
    }

    maven { url = "https://jitpack.io" }
}

loom {
    accessWidenerPath = file("src/main/resources/integrationsoplenty.accesswidener")
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modImplementation "curse.maven:farmers-delight-refabricated-${project.farmersdelight_project_id}:${project.farmersdelight_file_id}"

    modImplementation "curse.maven:biomes-o-plenty-${project.bop_project_id}:${project.bop_file_id}"

    modRuntimeOnly "curse.maven:terrablender-fabric-${project.terrablender_project_id}:${project.terrablender_file_id}"

    modRuntimeOnly "curse.maven:glitchcore-${project.glitchcore_project_id}:${project.glitchcore_file_id}"
    modRuntimeOnly "com.github.Chocohead:Fabric-ASM:v2.3"
    runtimeOnly "net.jodah:typetools:0.6.3"
    runtimeOnly "com.electronwill.night-config:core:3.8.3"
    runtimeOnly "com.electronwill.night-config:toml:3.8.3"
}

processResources {
    var expandProps = [
            minecraft_version: minecraft_version,
            mod_id           : mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_authors      : mod_authors, mod_description: mod_description,
            mod_page_url     : mod_page_url, mod_git_url: mod_git_url,
            mod_license      : mod_license
    ]

    filesMatching("fabric.mod.json") {
        expand expandProps
    }

    inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
    }
}